<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="loopTitle loopDesc">
  <title id="loopTitle">The glassbox five-phase loop</title>
  <desc id="loopDesc">Perceive, Model, Execute, Verify, Evolve: five nodes joined by arrows, with Evolve looping back to Perceive.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#5EE6D0"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#7AA2FF"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="#0B0E14"/>
  <text x="46" y="40" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="2.6" fill="#8A94A6">THE FIVE-PHASE LOOP</text>

  <path d="M190 90 H214" stroke="#5EE6D0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M356 90 H380" stroke="#5EE6D0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M522 90 H546" stroke="#5EE6D0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M688 90 H712" stroke="#5EE6D0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M782 116 V196 H118 V120" fill="none" stroke="#7AA2FF" stroke-width="1.6" stroke-linejoin="round" opacity="0.85" marker-end="url(#arrowBack)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="118" y="57" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#7AA2FF">01</text>
    <text x="284" y="57" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#7AA2FF">02</text>
    <text x="450" y="57" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#7AA2FF">03</text>
    <text x="616" y="57" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#7AA2FF">04</text>
    <text x="782" y="57" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#7AA2FF">05</text>

    <g fill="#11151F" stroke="#2A3142" stroke-width="1.5">
      <rect x="50" y="64" width="136" height="52" rx="13"/>
      <rect x="216" y="64" width="136" height="52" rx="13"/>
      <rect x="382" y="64" width="136" height="52" rx="13"/>
      <rect x="548" y="64" width="136" height="52" rx="13"/>
      <rect x="714" y="64" width="136" height="52" rx="13"/>
    </g>

    <g fill="#E8ECF1" font-size="16" font-weight="600" text-anchor="middle">
      <text x="118" y="96">Perceive</text>
      <text x="284" y="96">Model</text>
      <text x="450" y="96">Execute</text>
      <text x="616" y="96">Verify</text>
      <text x="782" y="96">Evolve</text>
    </g>

    <g fill="#8A94A6" font-size="12.5" text-anchor="middle">
      <text x="118" y="145">ground truth, dated</text>
      <text x="284" y="145">write the contract</text>
      <text x="450" y="145">smallest harness</text>
      <text x="616" y="145">prove with artifacts</text>
      <text x="782" y="145">leave it smarter</text>
    </g>
  </g>
</svg>
